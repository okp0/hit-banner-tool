<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>🎯 的中バナー&ページ 生成</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    pre { white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
  </style>
</head>
<body class="bg-gray-100 p-6">
  
  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl p-8">
    <!-- タイトル + ログアウトボタン -->
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🎯</span>
        <h1 class="text-3xl font-bold">的中バナー&ページ 生成ツール</h1>
      </div>
      
      <button onclick="logout()" 
              class="text-red-600 hover:text-red-700 font-medium flex items-center gap-1 px-4 py-2 rounded-lg hover:bg-red-50 transition whitespace-nowrap">
        ← ログアウト
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- 入力 -->
      <div class="space-y-6">
        <div>
          <label class="block text-sm mb-1 font-medium">的中ページ_リンク (cid)</label>
          <input id="cid" value="104733" class="w-full border p-3 rounded-lg">
        </div>

        <div>
          <label class="block text-sm mb-1 font-medium">提供ランク</label>
          <select id="rank" onchange="updateRankInfo()" class="w-full border p-3 rounded-lg">
            <option value="プレミアム勝負" selected>プレミアム勝負</option>
            <option value="限定勝負">限定勝負</option>
            <option value="Bランク">Bランク</option>
            <option value="Cランク">Cランク</option>
            <option value="厳選提供">厳選提供</option>
            <option value="重賞メイン">重賞メイン</option>
            <option value="境軍団">境軍団【SAKURA】</option>
            <option value="西の馬券師集団">西の馬券師集団</option>
            <option value="チームスタリオン">チームスタリオン</option>
            <option value="ジョッキー情報特捜班">ジョッキー情報特捜班</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm mb-1">ot_kenshu（自動）</label>
            <input id="kenshu" readonly class="w-full border p-3 rounded-lg bg-gray-50">
          </div>
          <div>
            <label class="block text-sm mb-1">サムネイル（自動）</label>
            <input id="thumb" readonly class="w-full border p-3 rounded-lg bg-gray-50 text-xs">
          </div>
        </div>

        <!-- 的中情報のテキスト一括貼り付けエリア -->
        <div>
          <label class="block text-sm mb-1 font-medium text-blue-600">的中情報のテキスト塊（ここに貼り付け）</label>
          <textarea id="rawInput" rows="11" class="w-full border p-4 rounded-lg font-mono text-sm" placeholder=""></textarea>
        </div>

        <div class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-sm mb-1">タイトル1行目</label>
            <input id="title1" class="w-full border p-3 rounded-lg">
          </div>
          <div>
            <label class="block text-sm mb-1">タイトル2行目</label>
            <input id="title2" class="w-full border p-3 rounded-lg">
          </div>
        </div>

        <div>
          <label class="block text-sm mb-1">推奨文タグをここに貼り付け...</label>
          <textarea id="bodyText" rows="6" class="w-full border p-4 rounded-lg"></textarea>
        </div>
      </div>

      <!-- 出力 -->
      <div>
        <!-- 的中ページのみ生成するチェックボックス（ボタンの真上に移動） -->
        <div class="flex items-center gap-2 bg-blue-50 p-4 rounded-lg border border-blue-100 mb-4">
          <input type="checkbox" id="onlyPage" class="w-5 h-5 text-blue-600 rounded">
          <label for="onlyPage" class="text-sm font-medium text-blue-900 cursor-pointer">
            的中ページのみ生成
          </label>
        </div>

        <button onclick="generateBoth()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl text-lg font-medium mb-6">
          🔄 的中バナー&ページ 生成
        </button>

        <div class="mb-6">
          <h3 class="font-bold mb-2">的中バナー</h3>
          <pre id="bannerOutput" class="bg-gray-900 text-green-300 p-5 rounded-xl text-sm h-64 overflow-auto"></pre>
          <button onclick="copyText('bannerOutput')" class="mt-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm">コピー</button>
        </div>

        <div>
          <h3 class="font-bold mb-2">的中ページ</h3>
          <pre id="pageOutput" class="bg-gray-900 text-green-300 p-5 rounded-xl text-sm h-64 overflow-auto"></pre>
          <button onclick="copyText('pageOutput')" class="mt-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm">コピー</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const thumbnailMap = {
      "限定勝負": "https://www-f.t-tank.net/img/pics/thumbnail/gentei.jpg",
      "プレミアム勝負": "https://www-f.t-tank.net/img/pics/thumbnail/premium.jpg",
      "Bランク": "https://www-f.t-tank.net/img/pics/thumbnail/gensen.jpg",
      "Cランク": "https://www-f.t-tank.net/img/pics/thumbnail/C.jpg",
      "厳選提供": "https://www-f.t-tank.net/img/pics/thumbnail/gensen.jpg",
      "重賞メイン": "https://www-f.t-tank.net/img/pics/thumbnail/jusyo.jpg",
      "境軍団": "https://www-f.t-tank.net/img/thumb/uraneta/tit_uraneta_05.jpg",
      "西の馬券師集団": "https://www-f.t-tank.net/img/thumb/uraneta/tit_uraneta_04.jpg",
      "チームスタリオン": "https://www-f.t-tank.net/img/pics/thumbnail/tit_uraneta_11.jpg",
      "ジョッキー情報特捜班": "https://www-f.t-tank.net/img/pics/thumbnail/tit_uraneta_14.jpg"
    };

    const kenshuMap = {
      "限定勝負": "限定勝負レース",
      "プレミアム勝負": "プレミアム勝負レース",
      "Bランク": "推薦勝負レースB",
      "Cランク": "推薦勝負レースC",
      "厳選提供": "特注馬出走レースD",
      "重賞メイン": "",
      "境軍団": "境軍団【SAKURA】",
      "西の馬券師集団": "西の馬券師集団",
      "チームスタリオン": "チームスタリオン",
      "ジョッキー情報特捜班": "ジョッキー情報特捜班"
    };

    function updateRankInfo() {
      const rank = document.getElementById('rank').value;
      document.getElementById('thumb').value = thumbnailMap[rank] || "";
      let k = kenshuMap[rank] || rank;
      if (rank === "重賞メイン") {
        k = window.currentRaceName || "重賞メイン";
      }
      document.getElementById('kenshu').value = k;
    }

    // 全角数字や全角記号を半角に変換するヘルパー
    function toHalfWidth(str) {
      if (!str) return "";
      return str.replace(/[０-９Ａ-Ｚａ-ｚｄＡ-Ｚ（）]/g, function(s) {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
      }).replace(/[～〜]/g, "~");
    }

    // 金額文字列を半角・整形する処理
    function parseAndFormatMoney(moneyStr) {
      if (!moneyStr) return "";
      let half = toHalfWidth(moneyStr).trim();
      half = half.replace(/的中/g, "").replace(/\s+/g, "");
      return half;
    }

    function generateBoth() {
      const rawText = document.getElementById('rawInput').value;
      const rank = document.getElementById('rank').value;
      const thumb = document.getElementById('thumb').value;
      const isOnlyPage = document.getElementById('onlyPage').checked;
      
      let dateLine = "";
      let raceTitleLine = "";
      let horses = [];
      let payouts = {};

      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l !== "");

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        if (line.includes("月") && (line.includes("日") || line.includes("("))) {
          dateLine = line;
        } 
        else if (line.startsWith("『") || line.includes("『")) {
          raceTitleLine = line.replace(/[『』]/g, "").replace(/サラ系/g, "");
        }
        else if (/^[◎◯〇▲△★].+/.test(line)) {
          let mark = line.charAt(0);
          if (mark === "★") {
            mark = "△";
          }
          let horseName = line.substring(1).trim();
          let popNum = "";
          if (i + 1 < lines.length && lines[i+1].includes("人気")) {
            let nextLine = toHalfWidth(lines[i+1]);
            let popMatch = nextLine.match(/(\d+)人気/);
            if (popMatch) {
              popNum = popMatch[1];
            }
            i++;
          }
          horses.push({ mark, horseName, popNum });
        }
        else if (line.includes("連単") || line.includes("連複") || line.includes("馬") || line.includes("ワイド") || line.includes("単勝") || line.includes("複勝")) {
          let halfLine = toHalfWidth(line);
          let cleanLine = halfLine.replace(/\s+/g, ""); // スペースを削除して判定
          
          if (cleanLine.includes("3連単") || cleanLine.includes("３連単")) {
            payouts["3連単"] = parseAndFormatMoney(cleanLine.replace(/.*3連単/, ""));
          } else if (cleanLine.includes("3連複") || cleanLine.includes("３連複")) {
            payouts["3連複"] = parseAndFormatMoney(cleanLine.replace(/.*3連複/, ""));
          } else if (cleanLine.includes("馬連")) {
            payouts["馬連"] = parseAndFormatMoney(cleanLine.replace(/.*馬連/, ""));
          }
        }
      }

      // 日付の整形（曜日とレース名の間のスペースを除去）
      let formattedDate = toHalfWidth(dateLine);
      formattedDate = formattedDate.replace(/^\d+年/, "").replace(/(\([月火水木金土日]\))\s+/, "$1");

      window.currentRaceName = raceTitleLine;

      let kenshu = kenshuMap[rank] || rank;
      if (rank === "重賞メイン") {
        kenshu = raceTitleLine || "重賞メイン";
      }

      const title1 = document.getElementById('title1').value;
      const title2 = document.getElementById('title2').value;

      // タイトルのHTML生成
      let titleHtml = "";
      if (title1 && title2) {
        titleHtml = `<p class="ot_ti_text"><span style="color:#FF0000">${title1}</span><br>${title2}</p>\n<br>`;
      } else if (title1) {
        titleHtml = `<p class="ot_ti_text"><span style="color:#FF0000">${title1}</span></p>\n<br>`;
      } else if (title2) {
        titleHtml = `<p class="ot_ti_text">${title2}</p>\n<br>`;
      }

      // 馬情報の展開（人気表示の条件分岐を適用）
      let horseHtml = "";
      horses.slice(0, 3).forEach((h, index) => {
        let style = index === 0 ? ' style="color:#FF0000"' : '';
        
        let showPop = false;
        if (h.popNum === "1") {
          showPop = false;
        } else if (h.popNum === "2") {
          if (h.mark === "◎") {
            showPop = true;
          }
        } else if (h.popNum === "3") {
          if (h.mark !== "▲" && h.mark !== "△") {
            showPop = true;
          }
        } else if (h.popNum) {
          showPop = true;
        }

        let popText = showPop ? `(${h.popNum}番人気)` : "";
        horseHtml += `<span${style}><b>${h.mark}${h.horseName}</b>${popText}</span><br>\n`;
      });

      // ① 馬連のn点目自動判定処理
      let umaRenLabel = "馬連";
      if (horses.length >= 2) {
        let firstMark = horses[0].mark;  // 上1頭目
        let secondMark = horses[1].mark; // 上2頭目
        let combination = firstMark + secondMark;

        // 〇◎ または ◎〇 の場合は 1点目
        if (combination === "〇◎" || combination === "◎〇" || combination === "◯◎" || combination === "◎◯") {
          umaRenLabel = "馬連1点目";
        }
        // ▲◎ または ◎▲ の場合は 2点目
        else if (combination === "▲◎" || combination === "◎▲") {
          umaRenLabel = "馬連2点目";
        }
      }

      // 払戻金HTMLの生成
      let payoutHTML = "";
      if (payouts["3連単"]) {
        payoutHTML += `<span>3連単</span><strong>${payouts["3連単"]}</strong>的中<br>\n`;
      }
      if (payouts["3連複"]) {
        payoutHTML += `<span>3連複</span><strong>${payouts["3連複"]}</strong>的中<br>\n`;
      }
      if (payouts["馬連"]) {
        payoutHTML += `<span>${umaRenLabel}</span><strong>${payouts["馬連"]}</strong>的中<br>\n`;
      }

      const cid = document.getElementById('cid').value || "104733";
      const bodyText = document.getElementById('bodyText').value;

      // 的中バナー（「的中ページのみ生成」にチェックが入っている場合は非表示にする）
      let banner = "";
      if (!isOnlyPage) {
        banner = `<div class="tekicyuBox">
<a href="/members/hit/record.html?cid=${cid}#teki03">
<div class="tekicyuImg"><img src="${thumb}" alt=""></div>
<div class="tekicyuBottom">
${titleHtml}<p class="ot_kenshu">${kenshu}</p>
<p class="ot_date">${formattedDate}</p>
<p class="ot_chakujun">
${horseHtml.trim()}
</p>
<p class="ot_haito">
${payoutHTML.trim()}
</p>
</div>
</a>
</div>`;
      }

      document.getElementById('bannerOutput').textContent = banner;

      // 的中ページ用（「的中ページのみ生成」の場合はアンカータグを付けない）
      const pageBanner = `<div class="tekicyuBox">
<div class="tekicyuImg"><img src="${thumb}" alt=""></div>
<div class="tekicyuBottom">
${titleHtml}<p class="ot_kenshu">${kenshu}</p>
<p class="ot_date">${formattedDate}</p>
<p class="ot_chakujun">
${horseHtml.trim()}
</p>
<p class="ot_haito">
${payoutHTML.trim()}
</p>
</div>
</div>`;

      let bodySection = "";
      if (bodyText) {
        bodySection = `<p class="ot_info"><strong>こんな情報でした</strong></p>
<div class="ot_box">
<p class="ot_text">${bodyText}</p>
</div>`;
      }

      let anchorTag = isOnlyPage ? "" : '<a name="teki03"></a>\n';

      const page = `<!--${raceTitleLine} ここから-->
${anchorTag}${pageBanner}
${bodySection}
<!--ボタン-->
<div style="text-align: center">
<a href="https://www.t-tank.net/members/hit/board.html" class="ot_btn">
実際に会員様から寄せられた<br>
的中画像、歓喜の声を公開中！
</a>
</div>
<!--${raceTitleLine} ここまで-->`;

      document.getElementById('pageOutput').textContent = page;
    }

    function copyText(id) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(() => alert('コピーしました！'));
    }

    function logout() {
      if (confirm("ログアウトしますか？")) {
        window.location.href = "login.html";
      }
    }

    window.onload = updateRankInfo;
  </script>
</body>
</html>
